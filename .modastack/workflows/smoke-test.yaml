name: smoke-test
trigger: When an issue labeled "smoke-test" is assigned.
description: >
  Two-step smoke test for CI. Says hello, then says goodbye.
  Completes in seconds. Used by the release pipeline to verify
  the full workflow engine works.

steps:
  - name: hello
    prompt: "Say HELLO_SMOKE_TEST and nothing else."
    timeout: 60

  - name: goodbye
    prompt: "Say GOODBYE_SMOKE_TEST and nothing else."
    timeout: 60
