version: "1.0.0"

entry_point: manager
chat: slack

services:
  - name: github
    events: true
  - name: email
    events: true

task_tracking:
  system: github-issues
  project: PLAYBOOK
  trigger_labels:
    - agent
    - content
    - research
  skip_labels:
    - blocked
    - human-only

verify:
  review_required: true
  auto_merge: false

context:
  content_dirs: "guides/ runbooks/ research/"
  style_guide: "Clear, concise, actionable. Write for practitioners, not academics."

venn_api_key: ${VENN_API_KEY}

monitors:
  - name: new-emails
    command: 'venn --json tools execute -s gmail -t list_emails -a ''{"userId": "me", "maxResults": 10, "q": "is:unread"}'''
    interval: 5m
    event: email/received
